[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suretyseven-underwriting"
version = "0.1.0"
description = "Small but production-minded surety bond application underwriting service (SuretySeven take-home)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.1; platform_system != 'Darwin' or python_version >= '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "matplotlib>=3.8",
]

[project.scripts]
suretyseven-api = "suretyseven.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests that exercise the HTTP surface with mocked dependencies",
]

[tool.coverage.run]
source = ["src/suretyseven"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors (indentation, whitespace)
    "E7",   # pycodestyle errors (statement issues)
    "E9",   # pycodestyle errors (runtime)
    "F",    # pyflakes (unused names, undefined names)
    "I",    # import sorting
    "UP",   # pyupgrade
    "RUF",  # ruff-specific (unused noqa, ambiguous annotations)
]

[tool.ruff.lint.isort]
known-first-party = ["suretyseven"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = "tests/"
